# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Gradle 8.1.1 ships Groovy 3.0.15, which cannot read Java 21 class files, so the Gradle
# engine itself must run on JDK 17. The mod code is still compiled by JDK 21 (see
# build.gradle toolchain) and emitted as Java 17 bytecode.
# Delete this line once you upgrade to Gradle 8.5+, which can run on Java 21 directly.
org.gradle.java.home=C:/Program Files/Java/jdk-17

# Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# Mod
mod_id=foodlog
mod_name=Food Log
mod_license=MIT
mod_version=1.1.5
mod_group_id=com.example.foodlog
mod_authors=Hutur861
mod_description=A client-side food encyclopedia that tracks which foods you have already eaten. Works on servers that do not have the mod installed.
